name: Raspberry Pi 5 ARM64 master build

on:
  push:
    branches:
      - build/master-rpi-arm64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 120

    steps:
      - name: Install checkout prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git git-lfs

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install native and ARM64 build dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y --no-install-recommends curl file rsync zip unzip build-essential cmake ninja-build pkg-config crossbuild-essential-arm64 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu python3 python3-lxml libxml2-utils qt6-base-dev-tools qt6-declarative-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-base-dev:arm64 qt6-declarative-dev:arm64 qt6-multimedia-dev:arm64 qt6-serialport-dev:arm64 qt6-svg-dev:arm64 qt6-websockets-dev:arm64 qt6-3d-dev:arm64 libglx-dev:arm64 libgl1-mesa-dev:arm64 libasound2-dev:arm64 libftdi-dev:arm64 libftdi1-dev:arm64 libfftw3-dev:arm64 libsndfile1-dev:arm64 libudev-dev:arm64 libusb-dev:arm64 libusb-1.0-0-dev:arm64 libxkbcommon-dev:arm64

      - name: Verify, build, and package
        run: ./scripts/raspi/all.sh

      - name: Inspect deliverables
        run: |
          sha256sum -c out/qlcplus5dev-rpi-arm64-*.tar.gz.sha256
          tar -tzf out/qlcplus5dev-rpi-arm64-*.tar.gz | grep -E 'BUILD-INFO.txt|usr/bin/qlcplus5dev'
          file out/rpi-arm64-rootfs/opt/qlcplus5-dev/usr/bin/qlcplus5dev

      - name: Upload Linux ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: qlcplus5dev-rpi-arm64-master
          path: |
            out/qlcplus5dev-rpi-arm64-*.tar.gz
            out/qlcplus5dev-rpi-arm64-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
